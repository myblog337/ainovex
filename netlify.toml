[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- API (static snapshots generated by scripts/postbuild.mjs) ----
[[redirects]]
  from = "/api/articles"
  to = "/api/articles/index.json"
  status = 200

[[redirects]]
  from = "/api/articles/:slug"
  to = "/api/articles/:slug/index.json"
  status = 200

[[redirects]]
  from = "/api/categories"
  to = "/api/categories.json"
  status = 200

[[redirects]]
  from = "/api/tools"
  to = "/api/tools.json"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/api/settings.json"
  status = 200

[[redirects]]
  from = "/api/ads"
  to = "/api/ads.json"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/api/health.json"
  status = 200

# Cloudflare function returned 404 here; keep same behaviour
[[redirects]]
  from = "/.well-known/ai-catalog.json"
  to = "/404.html"
  status = 404

# ---- SPA fallback (must be last) ----
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ---- Caching (Vite adds a content hash to /assets/* file names, so they never change) ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
