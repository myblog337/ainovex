[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- API (static snapshots generated by scripts/postbuild.mjs) ----
[[redirects]]
  from = "/api/articles"
  to = "/api/articles/index.json"
  status = 200

[[redirects]]
  from = "/api/articles/:slug"
  to = "/api/articles/:slug/index.json"
  status = 200

[[redirects]]
  from = "/api/categories"
  to = "/api/categories.json"
  status = 200

[[redirects]]
  from = "/api/tools"
  to = "/api/tools.json"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/api/settings.json"
  status = 200

[[redirects]]
  from = "/api/ads"
  to = "/api/ads.json"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/api/health.json"
  status = 200

# Canonical trailing-slash redirects for direct 1-hop normalization
[[redirects]]
  from = "/tools"
  to = "/tools/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/categories"
  to = "/categories/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/editorial-policy"
  to = "/editorial-policy/"
  status = 301

[[redirects]]
  from = "/affiliate-disclosure"
  to = "/affiliate-disclosure/"
  status = 301

[[redirects]]
  from = "/category/:slug"
  to = "/category/:slug/"
  status = 301

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301

# ---- 404 Fallback (serves custom 404 page with real HTTP 404 status code) ----
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Global security & SEO headers (enforces single-hop HTTPS with HSTS)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/c49a629b37c0411eb31a896d8e20791d.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ---- Caching (Vite adds content hashes to assets) ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "no-cache, no-store, must-revalidate"
