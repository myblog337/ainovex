    <script>
      (function() {
        try {
          var mode = localStorage.getItem('ainovex-theme-mode') || localStorage.getItem('ainovex-theme') || 'dark';
          var active = mode;
          if (mode === 'system') {
            active = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.dataset.theme = active;
          if (active === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-white text-slate-900 dark:bg-[#0b101b] dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
